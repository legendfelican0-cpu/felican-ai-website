<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 80" role="img" aria-label="Felican AI bot">
<style>
  .eyes { animation: blink 4.2s infinite; transform-origin: 70px 30px; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
  .tip { animation: tip 1.6s ease-in-out infinite; }
  @keyframes tip { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
  .core { animation: tip 2.2s ease-in-out infinite; }
  .car { animation: bump .32s ease-in-out infinite; }
  @keyframes bump { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-1.2px) } }
  .wheel { animation: spin .45s linear infinite; }
  .wheel.f { transform-origin: 104px 70px; }
  .wheel.b { transform-origin: 44px 70px; }
  @keyframes spin { to { transform: rotate(360deg) } }
  .puff { animation: puff 1s ease-out infinite; transform-origin: 18px 66px; }
  .puff.b { animation-delay: -.5s }
  @keyframes puff { 0% { opacity: 0; transform: translate(0,0) scale(.3) } 30% { opacity: .55 } 100% { opacity: 0; transform: translate(-14px,-6px) scale(1.3) } }
  .seat { transform: translate(0,4px) scale(.85); transform-origin: 70px 46px; }
</style>
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B2A2F"/><stop offset="1" stop-color="#0A1216"/></linearGradient>
  <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2FB894"/><stop offset="1" stop-color="#8FE0C8"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D9A944"/><stop offset=".5" stop-color="#F2CE7B"/><stop offset="1" stop-color="#C89435"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

  <g class="puff"><circle cx="18" cy="66" r="3" fill="#8FA3A8"/></g>
  <g class="puff b"><circle cx="18" cy="66" r="2.4" fill="#8FA3A8"/></g>
  <g class="car">
    <g class="seat">
  <g class="bot">
    <!-- antenna -->
    <line x1="70" y1="12" x2="70" y2="20" stroke="#8FE0C8" stroke-width="2.4" stroke-linecap="round"/>
    <circle class="tip" cx="70" cy="10" r="3.2" fill="#F2CE7B" filter="url(#glow)"/>
    <!-- head -->
    <rect x="54" y="19" width="32" height="24" rx="8" fill="url(#body)" stroke="#2FB894" stroke-width="1.6"/>
    <rect x="58" y="25" width="24" height="10" rx="5" fill="#05090C"/>
    <g class="eyes">
      <rect x="61" y="27.5" width="6" height="5" rx="2.5" fill="url(#visor)" filter="url(#glow)"/>
      <rect x="73" y="27.5" width="6" height="5" rx="2.5" fill="url(#visor)" filter="url(#glow)"/>
    </g>
    <!-- ear pods -->
    <rect x="50.5" y="26" width="4" height="9" rx="2" fill="#2FB894"/>
    <rect x="85.5" y="26" width="4" height="9" rx="2" fill="#2FB894"/>
    <!-- neck + torso -->
    <rect x="66" y="43" width="8" height="4" fill="#1C2A28"/>
    <rect x="57" y="46" width="26" height="20" rx="7" fill="url(#body)" stroke="#2FB894" stroke-width="1.6"/>
    <circle cx="70" cy="55" r="4" fill="#0A1216" stroke="#F2CE7B" stroke-width="1.4"/>
    <circle class="core" cx="70" cy="55" r="1.8" fill="#F2CE7B" filter="url(#glow)"/>
  </g>
    </g>
    <path d="M24 70 L28 58 Q30 54 36 54 L58 54 L58 70 Z M82 54 L96 54 Q102 54 104 58 L110 60 L124 61 Q128 62 128 65 L128 70 L82 70 Z" fill="#2FB894" stroke="#8FE0C8" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M58 70 L58 56 Q60 54 62 54 L78 54 Q82 54 82 58 L82 70 Z" fill="#25A383" stroke="#8FE0C8" stroke-width="1.2"/>
    <rect x="30" y="62" width="96" height="4" rx="2" fill="#F2CE7B" opacity=".9"/>
    <circle cx="124" cy="64" r="2.2" fill="#F2CE7B" filter="url(#glow)"/>
    <circle cx="26" cy="65" r="1.8" fill="#FF6B6B"/>
  </g>
  <g class="wheel b"><circle cx="44" cy="70" r="8" fill="#0A1216" stroke="#8FE0C8" stroke-width="2"/><path d="M44 63 V77 M37 70 H51" stroke="#8FE0C8" stroke-width="1.6"/><circle cx="44" cy="70" r="2" fill="#F2CE7B"/></g>
  <g class="wheel f"><circle cx="104" cy="70" r="8" fill="#0A1216" stroke="#8FE0C8" stroke-width="2"/><path d="M104 63 V77 M97 70 H111" stroke="#8FE0C8" stroke-width="1.6"/><circle cx="104" cy="70" r="2" fill="#F2CE7B"/></g>

</svg>
