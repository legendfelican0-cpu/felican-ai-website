<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="/analytics.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<header style="position:sticky;top:0;z-index:900;background:#080E13;border-bottom:1px solid rgba(47,184,148,0.22);font-family:Inter,system-ui,sans-serif">
  <div style="max-width:1280px;margin:0 auto;padding:0 24px;height:74px;display:flex;align-items:center;justify-content:space-between;gap:24px">
    <a href="/" aria-label="Felican AI home" style="display:flex;align-items:center;gap:12px;text-decoration:none;flex-shrink:0">
      <img src="/logo-mark.png" alt="" width="28" height="28" style="width:28px;height:28px;display:block">
      <span style="font-family:Sora,Inter,sans-serif;font-weight:800;font-size:19px;letter-spacing:-0.02em;color:#FFFFFF">Felican<span style="color:#2FB894"> AI</span></span>
    </a>

    <nav aria-label="Main" style="display:{{ deskDisplay }};align-items:center;gap:4px">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
        <a href="{{ l.href }}" aria-current="{{ l.current }}" style="position:relative;display:block;padding:10px 14px;font-size:16px;font-weight:500;color:{{ l.color }};text-decoration:none;border-radius:6px;transition:color .18s ease,background .18s ease" style-hover="color:#FFFFFF;background:rgba(47,184,148,0.14)" style-focus="outline:2px solid #2FB894;outline-offset:2px">
          {{ l.label }}
          <span aria-hidden="true" style="position:absolute;left:14px;right:14px;bottom:4px;height:2px;background:#2FB894;opacity:{{ l.bar }}"></span>
        </a>
      </sc-for>
    </nav>

    <div style="display:{{ deskDisplay }};align-items:center;gap:14px;flex-shrink:0">
      <a href="{{ bookingUrl }}" target="_blank" rel="noopener noreferrer" style="display:inline-block;padding:12px 20px;background:#2FB894;color:#080E13;font-size:16px;font-weight:700;text-decoration:none;transition:transform .18s ease,background .18s ease" style-hover="background:#59D4B4;transform:translateY(-2px)" style-focus="outline:2px solid #59D4B4;outline-offset:3px">Book a call</a>
    </div>

    <button type="button" onClick="{{ toggle }}" aria-expanded="{{ openStr }}" aria-label="Toggle navigation menu" style="display:{{ mobDisplay }};align-items:center;gap:10px;background:transparent;border:1px solid rgba(238,244,244,0.35);color:#FFFFFF;font-family:Inter,sans-serif;font-size:15px;font-weight:600;padding:11px 14px;border-radius:2px;cursor:pointer" style-focus="outline:2px solid #2FB894;outline-offset:3px">
      <span aria-hidden="true" style="display:grid;gap:4px;width:18px">
        <span style="height:2px;background:#FFFFFF;display:block"></span>
        <span style="height:2px;background:#2FB894;display:block"></span>
        <span style="height:2px;background:#FFFFFF;display:block"></span>
      </span>
      {{ menuLabel }}
    </button>
  </div>

  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="border-top:1px solid rgba(47,184,148,0.25);background:#05090C;padding:14px 24px 28px">
      <nav aria-label="Mobile" style="display:grid;gap:2px;max-width:1280px;margin:0 auto">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
          <a href="{{ l.href }}" style="display:flex;align-items:center;justify-content:space-between;padding:16px 4px;font-family:Sora,sans-serif;font-size:24px;font-weight:600;color:{{ l.color }};text-decoration:none;border-bottom:1px solid rgba(47,184,148,0.16)" style-focus="outline:2px solid #2FB894;outline-offset:2px">
            {{ l.label }}
            <span aria-hidden="true" style="color:#2FB894;font-size:20px">&#8594;</span>
          </a>
        </sc-for>
        <a href="{{ bookingUrl }}" target="_blank" rel="noopener noreferrer" style="margin-top:20px;display:block;text-align:center;padding:16px;background:#2FB894;color:#080E13;font-size:17px;font-weight:700;text-decoration:none;border-radius:2px">Book a call</a>
      </nav>
    </div>
  </sc-if>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Home&quot;,&quot;Products&quot;,&quot;Services&quot;,&quot;Books&quot;,&quot;About Us&quot;,&quot;Contact&quot;,&quot;Book a Call&quot;],&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false, w: typeof window !== 'undefined' ? window.innerWidth : 1400 };
  componentDidMount() {
    this._r = () => this.setState({ w: window.innerWidth, open: false });
    window.addEventListener('resize', this._r);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._r); }
  renderVals() {
    const active = (this.props.active || 'Home');
    const defs = [
      ['Home', '/'], ['Products', '/products/'], ['Services', '/services/'],
      ['Books', '/books/'], ['About Us', '/about/'], ['Contact', '/contact/']
    ];
    const mobile = this.state.w < 1024;
    return {
      links: defs.map(([label, href]) => {
        const on = label === active;
        return { label, href, current: on ? 'page' : undefined, color: on ? '#FFFFFF' : '#9FC0BE', bar: on ? 1 : 0 };
      }),
      bookingUrl: 'https://cal.com/felican-ai-inc-n68piw/30min',
      open: this.state.open,
      openStr: this.state.open ? 'true' : 'false',
      menuLabel: this.state.open ? 'Close' : 'Menu',
      deskDisplay: mobile ? 'none' : 'flex',
      mobDisplay: mobile ? 'flex' : 'none',
      toggle: () => this.setState(s => ({ open: !s.open }))
    };
  }
}

</script>
</body>
</html>
