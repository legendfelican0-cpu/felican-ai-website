<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@keyframes fa-in { from { opacity:0; transform:translateY(14px) } to { opacity:1; transform:none } }
@keyframes fa-dot { 0%,80%,100% { opacity:.25 } 40% { opacity:1 } }
@keyframes fa-pulse { 0%,100% { box-shadow:0 0 0 0 rgba(47,184,148,.42) } 50% { box-shadow:0 0 0 7px rgba(47,184,148,0) } }
.fa-shell { position:fixed;right:28px;bottom:94px;z-index:1000;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:flex-end;gap:14px;max-width:calc(100vw - 56px);pointer-events:none }

.fa-panel { position:relative;width:min(430px,calc(100vw - 56px));height:min(650px,calc(100vh - 124px));background:#0C1419;border:1px solid rgba(47,184,148,.3);border-radius:22px;box-shadow:0 28px 80px rgba(5,9,12,.55),0 4px 16px rgba(47,184,148,.12);display:flex;flex-direction:column;overflow:hidden;animation:fa-in .24s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom right }

.fa-head { background:linear-gradient(135deg,#080E13 0%,#12281F 100%);padding:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0 }

.fa-chip:hover { background:#2FB894;color:#080E13;border-color:#2FB894;transform:translateY(-1px) }
.fa-composer { padding:14px;background:#0C1419;border-top:1px solid #1C2A28;display:flex;gap:9px;flex-shrink:0 }

.fa-voice-signal.listening { border-color:#2FB894;box-shadow:0 0 0 5px rgba(47,184,148,.10),inset 0 0 0 5px rgba(47,184,148,.08) }.fa-voice-signal.listening i { background:#59D4B4;animation:fa-level 1.35s ease-in-out infinite }.fa-voice-signal.hearing { border-color:#59D4B4;box-shadow:0 0 0 7px rgba(47,184,148,.18),0 0 24px rgba(47,184,148,.28) }.fa-voice-signal.hearing i { background:#74F0CE;animation:fa-level .52s ease-in-out infinite }.fa-voice-signal.speaking { border-color:#F2CD7A;box-shadow:0 0 0 6px rgba(242,205,122,.15),0 0 22px rgba(242,205,122,.22) }.fa-voice-signal.speaking i { background:#F2CD7A;animation:fa-level .68s ease-in-out infinite }.fa-voice-signal i:nth-child(2) { animation-delay:-.16s }.fa-voice-signal i:nth-child(3) { animation-delay:-.31s }.fa-voice-signal i:nth-child(4) { animation-delay:-.22s }.fa-voice-signal i:nth-child(5) { animation-delay:-.09s }
@keyframes fa-level { 0%,100% { transform:scaleY(.42) } 50% { transform:scaleY(1) } }
.fa-voice-copy { min-width:0;flex:1 }.fa-voice-copy strong { display:block;color:#FFFFFF;font:800 14px Sora,sans-serif }.fa-voice-copy span { display:block;margin-top:4px;color:#AFCAC6;font-size:12px;line-height:1.35 }
.fa-voice-btn { flex:0 0 auto;border:1px solid #59D4B4;background:#2FB894;color:#080E13;border-radius:999px;padding:11px 16px;font:800 12px Sora,sans-serif;cursor:pointer;box-shadow:0 8px 22px rgba(47,184,148,.24);transition:.18s ease }
.fa-voice-btn:hover { background:#59D4B4;transform:translateY(-1px) }.fa-voice-btn.listening { background:#59D4B4;color:#080E13;box-shadow:0 0 0 5px rgba(47,184,148,.14) }.fa-voice-btn.speaking { background:#F2CD7A;border-color:#F2CD7A;color:#080E13;box-shadow:0 0 0 5px rgba(242,205,122,.14) }
.fa-input { flex:1;min-width:0;border:1px solid #1C2A28;background:#05090C;color:#EEF4F4;font-family:Inter,sans-serif;font-size:16px;padding:13px 17px;border-radius:999px }

.fa-hf { width:100%;border:1px solid #1C2A28;background:#05090C;color:#EEF4F4;font-family:Inter,sans-serif;font-size:15px;padding:11px 13px;border-radius:9px;resize:vertical }

.fa-hf-cancel { padding:11px 15px;background:transparent;border:1px solid #1C2A28;color:#9FC0BE;font-family:Inter,sans-serif;font-size:14px;font-weight:600;border-radius:999px;cursor:pointer }
.fa-launcher { position:relative;min-height:72px;display:flex;align-items:center;gap:12px;padding:7px 19px 7px 8px;border:1px solid rgba(47,184,148,.55);border-radius:999px;background:linear-gradient(145deg,#151D21 0%,#080C0F 65%,#030506 100%);color:#FFFFFF;cursor:pointer;box-shadow:0 18px 44px rgba(0,0,0,.55),0 0 0 1px rgba(47,184,148,.18),inset 0 1px 0 rgba(255,255,255,.10);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease;text-align:left }
.fa-launcher:hover { transform:translateY(-4px);border-color:#2FB894;box-shadow:0 23px 52px rgba(0,0,0,.6),0 0 0 2px rgba(47,184,148,.3),inset 0 1px 0 rgba(255,255,255,.14) }
.fa-launch-portrait { position:relative;width:56px;height:56px;display:grid;place-items:center;flex:0 0 56px;border-radius:50%;background:radial-gradient(circle at 40% 28%,#24473D,#0B1917 72%);border:1px solid rgba(143,224,200,.34) }
.fa-launch-mark { width:34px;height:34px;object-fit:contain }
.fa-launch-status { position:absolute;z-index:2;right:1px;bottom:3px;width:14px;height:14px;border:3px solid #0A1115;border-radius:50%;background:#55E6A5;animation:fa-pulse 2.2s ease-in-out infinite }
.fa-launch-copy { display:block;min-width:124px }.fa-launch-copy strong { display:block;font:700 14px Sora,sans-serif;color:#FFFFFF }.fa-launch-copy small { display:block;margin-top:4px;color:#8FE0C8;font-size:12px;letter-spacing:.02em }
.fa-cred { position:fixed;z-index:950;left:0;right:0;bottom:0;min-height:76px;background:linear-gradient(112deg,#D9A944 0%,#F2CE7B 52%,#C89435 100%);box-shadow:0 -8px 30px rgba(0,0,0,.34);font-family:Inter,system-ui,sans-serif;color:#10161B }
.fa-cred-inner { width:min(1280px,100%);min-height:76px;margin:0 auto;padding:10px 24px;display:grid;grid-template-columns:minmax(250px,1fr) minmax(420px,1fr);align-items:center;gap:22px;color:inherit;text-decoration:none }
.fa-cred-copy { display:flex;align-items:center;gap:11px;min-width:0 }.fa-cred-copy > span:first-child { width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:10px;background:#0C1419 }.fa-cred-copy img { width:25px;height:25px;object-fit:contain }.fa-cred-copy small { display:block;font-size:10px;font-weight:800;line-height:1;letter-spacing:.18em;text-transform:uppercase;color:#5C4718 }.fa-cred-copy strong { display:block;margin-top:4px;font:800 clamp(13px,1.5vw,17px)/1.05 Sora,sans-serif;letter-spacing:-.01em;text-transform:uppercase }
.fa-cred-logos { display:grid;grid-template-columns:repeat(5,72px);align-items:center;justify-content:center;justify-items:center;gap:clamp(9px,1.2vw,16px);min-width:0 }.fa-cred-logo { width:72px;height:44px;display:grid;place-items:center;overflow:hidden }.fa-cred-logo img { display:block;max-width:64px;max-height:32px;width:auto;height:auto;object-fit:contain }.fa-cred-logo.aws img { max-width:58px;max-height:30px }.fa-cred-logo.azure img { max-width:30px;max-height:30px }.fa-cred-logo.openai img { max-width:42px;max-height:42px }
@media (max-width:640px) {
  .fa-shell { right:10px;bottom:88px;max-width:calc(100vw - 20px) }
  .fa-panel { width:calc(100vw - 28px);height:min(600px,calc(100vh - 104px));border-radius:19px }
  .fa-launcher { min-height:58px;padding:5px 13px 5px 6px }
  .fa-launch-portrait { width:46px;height:46px;flex-basis:46px }
  .fa-launch-mark { width:29px;height:29px }
  .fa-launch-copy { min-width:105px }.fa-launch-copy strong { font-size:13px }.fa-launch-copy small { font-size:11px }
  .fa-head { padding:18px }
  .fa-messages { padding:16px }
  .fa-cred { min-height:78px }
  .fa-cred-inner { min-height:78px;padding:8px 12px;display:flex;justify-content:center;gap:0 }
  .fa-cred-copy { display:none }
  .fa-cred-logos { width:min(340px,100%);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;justify-items:center }
  .fa-cred-logo { width:100%;height:44px;max-width:56px;min-width:0;overflow:hidden }
  .fa-cred-logo img { max-width:46px;max-height:30px;width:auto;height:auto }
  .fa-cred-logo.aws img { max-width:46px;max-height:28px }.fa-cred-logo.azure img { max-width:30px;max-height:30px }.fa-cred-logo.openai img { max-width:40px;max-height:40px }
  .fa-voice { padding:13px 14px;gap:10px }.fa-voice-copy strong { font-size:13px }.fa-voice-copy span { font-size:11px }.fa-voice-btn { padding:10px 13px }
}

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.001ms !important; transition-duration:.001ms !important } }
</style>
</helmet>
<div class="fa-shell">

  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <section class="fa-panel" aria-label="Felican AI assistant">
      <div class="fa-head">
        <div style="display:flex;align-items:center;gap:11px">
          <span class="fa-head-mark" aria-hidden="true">
            <img src="/logo-mark.png" alt="" style="width:100%;height:100%;object-fit:contain;display:block">
          </span>
          <div>
            <p style="margin:0;font-family:Sora,sans-serif;font-size:16px;font-weight:700;color:#FFFFFF">Chat AI Assistant</p>
            <p style="margin:3px 0 0;font-size:13px;color:#9FC0BE">Live agent demo · usually replies instantly</p>
          </div>
        </div>
        <button class="fa-close" type="button" onClick="{{ close }}" aria-label="Close assistant" style-focus="outline:2px solid #8FE0C8;outline-offset:2px">&#215;</button>
      </div>

      <sc-if value="{{ composerOpen }}" hint-placeholder-val="{{ true }}">
        <div class="fa-voice">
          <div class="fa-voice-signal {{ voiceClass }}" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="fa-voice-copy"><strong>Talk naturally with Felican AI</strong><span aria-live="polite">{{ voiceStatus }}</span></div>
          <button class="fa-voice-btn {{ voiceClass }}" type="button" onClick="{{ toggleVoice }}" aria-pressed="{{ listeningStr }}" style-focus="outline:2px solid #8FE0C8;outline-offset:2px">{{ voiceLabel }}</button>
        </div>
      </sc-if>

      <div class="fa-messages" ref="{{ scrollRef }}" role="log" aria-live="polite">
        <sc-for list="{{ messages }}" as="m" hint-placeholder-count="1">
          <div class="fa-message" style="align-self:{{ m.align }};background:{{ m.bg }};color:{{ m.fg }};border:1px solid {{ m.border }}">{{ m.text }}</div>
        </sc-for>
        <sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}">
          <div aria-label="Assistant is typing" style="align-self:flex-start;display:flex;gap:5px;padding:14px">
            <span style="width:7px;height:7px;border-radius:50%;background:#2FB894;animation:fa-dot 1.2s infinite"></span>
            <span style="width:7px;height:7px;border-radius:50%;background:#2FB894;animation:fa-dot 1.2s .18s infinite"></span>
            <span style="width:7px;height:7px;border-radius:50%;background:#2FB894;animation:fa-dot 1.2s .36s infinite"></span>
          </div>
        </sc-if>
      </div>

      <sc-if value="{{ showChips }}" hint-placeholder-val="{{ true }}">
        <div class="fa-chips">
          <sc-for list="{{ chips }}" as="c" hint-placeholder-count="3">
            <button class="fa-chip" type="button" onClick="{{ c.go }}" style-focus="outline:2px solid #2FB894;outline-offset:2px">{{ c.label }}</button>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{ handoff }}" hint-placeholder-val="{{ false }}">
        <form class="fa-handoff" onSubmit="{{ sendHandoff }}">
          <p class="fa-handoff-title">Send this to a person</p>
          <p class="fa-handoff-note">{{ handoffNote }}</p>
          <input class="fa-hf" type="text" value="{{ hName }}" onChange="{{ onHName }}" placeholder="Your name" maxlength="120" autoComplete="name">
          <input class="fa-hf" type="email" value="{{ hEmail }}" onChange="{{ onHEmail }}" placeholder="Your email" maxlength="160" autoComplete="email">
          <textarea class="fa-hf" rows="3" value="{{ hMsg }}" onChange="{{ onHMsg }}" placeholder="What should we help with?" maxlength="2000"></textarea>
          <input type="text" name="website" value="{{ website }}" onChange="{{ onWebsite }}" tabindex="-1" autoComplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0;height:0;width:0;overflow:hidden">
          <div class="fa-handoff-row">
            <button class="fa-hf-send" type="submit" disabled="{{ hBusy }}" style-focus="outline:2px solid #8FE0C8;outline-offset:2px">{{ hSendLabel }}</button>
            <button class="fa-hf-cancel" type="button" onClick="{{ closeHandoff }}" style-focus="outline:2px solid #8FE0C8;outline-offset:2px">Cancel</button>
          </div>
        </form>
      </sc-if>

      <p class="fa-privacy">Please do not share confidential or sensitive information. See our <a href="/privacy/">Privacy Policy</a>.</p>
      <sc-if value="{{ composerOpen }}" hint-placeholder-val="{{ true }}">
        <form class="fa-composer" onSubmit="{{ submit }}">
          <label for="fa-input" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Your message</label>
          <input type="text" name="website" value="{{ website }}" onChange="{{ onWebsite }}" tabindex="-1" autoComplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden">
          <input class="fa-input" id="fa-input" type="text" value="{{ draft }}" onChange="{{ onDraft }}" placeholder="Ask anything about Felican AI" maxlength="800" autoComplete="off">
          <button class="fa-human" type="button" onClick="{{ openHandoff }}" title="Email a person" aria-label="Email a person at Felican AI" style-focus="outline:2px solid #2FB894;outline-offset:2px">&#9993;</button>
          <button class="fa-send" type="submit" aria-label="Send message" title="{{ sendLabel }}" style-focus="outline:2px solid #080E13;outline-offset:2px">&#8593;</button>
        </form>
      </sc-if>
    </section>
  </sc-if>

  <button class="fa-launcher" data-assistant-launcher="1" type="button" onClick="{{ toggle }}" aria-expanded="{{ openStr }}" aria-label="{{ launcherLabel }}" style-focus="outline:3px solid #8FE0C8;outline-offset:3px">
    <span class="fa-launch-portrait" aria-hidden="true"><img class="fa-launch-mark" src="/logo-mark.png" alt=""><span class="fa-launch-status"></span></span>
    <span class="fa-launch-copy"><strong>{{ btnLabel }}</strong><small>Voice + text</small></span>
  </button>
</div>

<aside class="fa-cred" aria-label="Verified AI credentials">
  <a class="fa-cred-inner" href="/about/#certifications">
    <span class="fa-cred-copy">
      <span aria-hidden="true"><img src="/logo-mark.png" alt=""></span>
      <span><small>Verified credentials</small><strong>Certified AI professionals</strong></span>
    </span>
    <span class="fa-cred-logos" aria-label="Certified platforms">
      <span class="fa-cred-logo aws"><img src="/badges/aws.png" alt="AWS"></span>
      <span class="fa-cred-logo"><img src="/badges/gcp.svg" alt="Google Cloud"></span>
      <span class="fa-cred-logo azure"><img src="/badges/azure.svg" alt="Microsoft Azure"></span>
      <span class="fa-cred-logo"><img src="/badges/anthropic.svg" alt="Anthropic"></span>
      <span class="fa-cred-logo openai"><img src="/badges/openai.svg" alt="OpenAI"></span>
    </span>
  </a>
</aside>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:640}}">
const SYS = `You are the Felican AI assistant running on the Felican AI website. Felican AI builds useful AI products, custom systems, business automations, integrations, assistants, solutions, and training for businesses in any industry. It is led by Lee Felican Jr., a software engineer and enterprise architect with 30+ years of experience.

The current product lineup includes: Private AI, the flagship product (enterprise-grade private AI with zero data exposure, deployed securely inside the customer's own network — recommend this first for any business worried about sensitive data); Felican Auto (connected AI products, automations and workflows for automotive businesses); World of Agents (discover and work with specialized AI agents for focused business tasks); Relay (AI field-service software for HVAC, plumbing, and electrical companies with scheduling, AP invoice OCR, collections, quotes, crew management, and an AI operations assistant); and Chat AI Assistant (a company-trained AI agent businesses can embed inside a website or app to answer questions, recommend services, capture inquiries, connect workflows, and hand off to people). The portfolio is growing, so describe it as the current lineup without stating a fixed product count.

Services: AI agents and bots, business automation, custom integrations, private AI systems, AI implementation and consulting, business solutions, AI training and workshops. Felican AI works with businesses in any industry and designs solutions around how each company actually operates.

Education: the Education page includes Felican AI eBooks, books by Lee Felican Jr., upcoming courses, Tiny Techs for early learners, nonprofit partnerships, school partnerships, and corporate training. After visitors enter an email address or phone number, they are sent directly to the specific eBook they selected.

Lee Felican Jr. has published four books: The Big Balla's Guide to Making Money with AI, Don't Be Replaced, Stop Being Nice to AI, and The BIG AI Book.

Contact: email ai@felican.ai, or call (561) 235-0799 Monday to Friday, 9am-6pm Eastern. Visitors can also send a message straight to the team from this chat using the envelope button next to the message box, or from the contact page at /contact/.

Felican AI is a team of more than ten certified AI professionals with backgrounds across every major industry, led by Lee Felican Jr.

Answer in 2-4 short sentences, plainly and helpfully. Use plain text only: no Markdown syntax, headings, code blocks, or emoji. Never invent customers, statistics, pricing, awards, or products that are not listed above. If you do not know, say so and point the visitor to the contact page.`;

class Component extends DCLogic {
  state = {
    open: new URLSearchParams(window.location.search).has('assistant'), busy: false, draft: '', website: '',
    handoff: false, hName: '', hEmail: '', hMsg: '', hBusy: false,
    voiceSupported: false, voiceActive: false, voiceConnecting: false, speaking: false, userSpeaking: false, micDetected: false, liveTranscript: '', voiceError: '',
    messages: [{ role: 'assistant', text: "Hi — I'm the Felican AI agent. Ask me about our products, services, training, or Lee's books." }]
  };
  scrollRef = React.createRef();

  componentDidMount() {
    const preset = window.__FELICAN_VAPI_CONFIG__;
    if (preset && preset.publicKey && preset.assistantId) {
      this._voiceReadyPromise = this.prepareVoice(preset);
      return;
    }
    this._voiceReadyPromise = fetch('/api/voice-config', { headers: { Accept: 'application/json' } })
      .then(response => response.ok ? response.json() : Promise.reject(new Error('voice_unavailable')))
      .then(config => {
        if (!config.publicKey || !config.assistantId) throw new Error('voice_unavailable');
        return this.prepareVoice(config);
      })
      .catch(() => this.setState({ voiceSupported: false }));
  }
  componentWillUnmount() {
    this.stopVoice();
  }
  async startMicMonitor() {
    this.stopMicMonitor();
    const mediaDevices = navigator.mediaDevices;
    if (!mediaDevices || typeof mediaDevices.getUserMedia !== 'function') {
      throw new Error('This browser cannot access your microphone. Try the latest Safari or Chrome.');
    }
    const stream = await mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: false
    });
    this._micStream = stream;
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    const context = new AudioContextClass();
    this._micContext = context;
    if (context.state === 'suspended' && context.resume) await context.resume();
    const analyser = context.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = .72;
    context.createMediaStreamSource(stream).connect(analyser);
    const samples = new Uint8Array(analyser.fftSize);
    this._micLastHeardAt = 0;
    this._micWasDetected = false;
    const measure = () => {
      if (!this._micStream || this._micStream !== stream) return;
      analyser.getByteTimeDomainData(samples);
      let energy = 0;
      for (let i = 0; i < samples.length; i += 1) {
        const centered = (samples[i] - 128) / 128;
        energy += centered * centered;
      }
      const level = Math.sqrt(energy / samples.length);
      const now = performance.now();
      if (level > .028) this._micLastHeardAt = now;
      const detected = now - this._micLastHeardAt < 420;
      if (detected !== this._micWasDetected) {
        this._micWasDetected = detected;
        this.setState({ micDetected: detected });
      }
      this._micFrame = requestAnimationFrame(measure);
    };
    this._micFrame = requestAnimationFrame(measure);
  }
  stopMicMonitor() {
    if (this._micFrame) cancelAnimationFrame(this._micFrame);
    this._micFrame = null;
    if (this._micStream) this._micStream.getTracks().forEach(track => track.stop());
    this._micStream = null;
    if (this._micContext && this._micContext.close) {
      try { this._micContext.close(); } catch (error) { /* already closed */ }
    }
    this._micContext = null;
    this._micWasDetected = false;
  }
  prepareVoice(config) {
    this._voiceConfig = config;
    // Load the browser voice client before the visitor taps Start. Mobile
    // Safari and Chrome require the microphone request to stay inside that
    // direct tap instead of waiting on a network import first.
    const ready = this.ensureVapi()
      .then(() => this.setState({ voiceSupported: true, voiceError: '' }))
      .catch(() => this.setState({ voiceSupported: false, voiceError: 'Voice could not load. You can still type below.' }));
    this._voiceReadyPromise = ready;
    return ready;
  }
  async loadVoiceClient() {
    if (window.__FELICAN_VAPI_CLASS__) return window.__FELICAN_VAPI_CLASS__;
    if (window.CopsVapi) return window.CopsVapi;
    if (this._voiceClientPromise) return this._voiceClientPromise;
    this._voiceClientPromise = new Promise((resolve, reject) => {
      const existing = document.querySelector('script[data-felican-vapi-sdk]');
      const finish = () => window.CopsVapi ? resolve(window.CopsVapi) : reject(new Error('The voice service did not become available.'));
      if (existing) {
        existing.addEventListener('load', finish, { once: true });
        existing.addEventListener('error', () => reject(new Error('The voice service could not load.')), { once: true });
        return;
      }
      const script = document.createElement('script');
      script.src = '/voice-client.bundle.js';
      script.async = true;
      script.defer = true;
      script.crossOrigin = 'anonymous';
      script.integrity = 'sha384-om2+KCCsCWb4oslvQoDmevbN/xaXx9cMxSf4Prw1kdgEFYKx2kOwJqWqDmhG8fKc';
      script.dataset.felicanVapiSdk = 'true';
      script.addEventListener('load', finish, { once: true });
      script.addEventListener('error', () => reject(new Error('The voice service could not load.')), { once: true });
      document.head.append(script);
    }).catch(error => {
      this._voiceClientPromise = null;
      throw error;
    });
    return this._voiceClientPromise;
  }
  async ensureVapi() {
    if (this._vapi) return this._vapi;
    if (this._vapiPromise) return this._vapiPromise;
    this._vapiPromise = (async () => {
      // Use the same patched browser client as the deployed COPS website. It
      // accepts the verified microphone track directly and avoids the Krisp
      // worklet path that can fail on mobile browsers.
      const Vapi = await this.loadVoiceClient();
      const vapi = new Vapi(
        this._voiceConfig.publicKey,
        undefined,
        { avoidEval: true, alwaysIncludeMicInPermissionPrompt: true },
        { audioSource: true, startAudioOff: false }
      );
      // Test doubles and future compatible clients keep the same COPS track
      // handoff contract even if they do not ship the helper themselves.
      if (typeof vapi.setAudioSource !== 'function') {
        vapi.setAudioSource = track => {
          if (!track || track.kind !== 'audio' || track.readyState === 'ended') throw new Error('A live microphone track is required.');
          vapi.dailyCallObject = { ...vapi.dailyCallObject, audioSource: track, startAudioOff: false };
        };
      }
      vapi.on('call-start', () => {
        vapi.setMuted?.(false);
        this.setState({ voiceActive: true, voiceConnecting: false, speaking: false, userSpeaking: false, liveTranscript: '', voiceError: '' });
      });
      vapi.on('call-end', () => {
        this.stopMicMonitor();
        this.setState({ voiceActive: false, voiceConnecting: false, speaking: false, userSpeaking: false, micDetected: false, liveTranscript: '' });
      });
      vapi.on('speech-start', () => this.setState({ voiceActive: true, speaking: true, userSpeaking: false, voiceError: '' }));
      // A reply ending is not the end of voice mode. The call stays live and
      // immediately returns to listening until the visitor presses Stop voice.
      vapi.on('speech-end', () => this.setState({ voiceActive: true, speaking: false }));
      vapi.on('local-volume-level', value => {
        const detected = Number(value) > .008;
        if (detected !== this._micWasDetected) {
          this._micWasDetected = detected;
          this.setState({ micDetected: detected });
        }
      });
      vapi.on('local-audio-level-observer-error', () => {
        // The COPS client treats a failed visual audio observer as non-fatal;
        // the microphone track can still reach the live call.
        if (this.state.voiceActive || this.state.voiceConnecting) this.setState({ voiceError: '' });
      });
      vapi.on('error', error => {
        const detail = [error && error.type, error && error.stage, error && error.message, error && error.error && error.error.type, error && error.error && error.error.message]
          .filter(Boolean).join(' ').toLowerCase();
        if (/audio-observer|audio\.processor|audio processor|krisp|local-audio-level/.test(detail)) {
          if (this.state.voiceActive || this.state.voiceConnecting) this.setState({ voiceError: '' });
          return;
        }
        this.stopMicMonitor();
        this.setState({
          voiceActive: false, voiceConnecting: false, speaking: false, userSpeaking: false, micDetected: false, liveTranscript: '',
          voiceError: error && error.message ? error.message : 'Voice had trouble connecting. You can still type below.'
        });
      });
      vapi.on('message', message => {
        if (message.type === 'speech-update' && message.role === 'user') {
          const started = message.status === 'started';
          this.setState(state => ({ userSpeaking: started, liveTranscript: started ? state.liveTranscript : '' }));
          return;
        }
        if (message.type !== 'transcript') return;
        const text = String(message.transcript || '').trim();
        if (!text) return;
        if (message.role === 'user' && message.transcriptType !== 'final') {
          this.setState({ userSpeaking: true, liveTranscript: text });
          return;
        }
        if (message.transcriptType !== 'final') return;
        const role = message.role === 'user' ? 'user' : 'assistant';
        if (role === 'assistant' && /voice-ready\.wav/i.test(text)) return;
        this.setState(state => {
          const last = state.messages[state.messages.length - 1];
          if (last && last.role === role && last.text === text) return { userSpeaking: false, liveTranscript: '' };
          return { messages: [...state.messages, { role, text }], userSpeaking: false, liveTranscript: '' };
        });
      });
      this._vapi = vapi;
      return vapi;
    })().catch(error => {
      this._vapiPromise = null;
      throw error;
    });
    return this._vapiPromise;
  }
  async startVoice() {
    if (this.state.voiceConnecting || this.state.voiceActive) return;
    this.setState({ voiceConnecting: true, voiceError: '' });
    try {
      // Read the microphone locally as well as through Vapi. This makes the
      // waveform react immediately and turns a blocked microphone into a clear
      // error instead of leaving the visitor wondering whether voice is live.
      await this.startMicMonitor();
      // A fast first tap must not be discarded while the CDN voice client or
      // public configuration is still loading. The microphone is already live,
      // so finish that same tap as soon as voice setup is ready.
      if (!this._voiceConfig && this._voiceReadyPromise) await this._voiceReadyPromise;
      if (!this._voiceConfig) throw new Error('Voice could not load. Please try again.');
      const vapi = this._vapi || await this.ensureVapi();
      const track = this._micStream && this._micStream.getAudioTracks ? this._micStream.getAudioTracks()[0] : null;
      vapi.setAudioSource(track);
      // Start the live room immediately after microphone permission resolves;
      // no unrelated work sits between the visitor's tap and the voice call.
      await vapi.start(this._voiceConfig.assistantId, {
        firstMessageMode: 'assistant-waits-for-user',
        firstMessageInterruptionsEnabled: false
      });
    } catch (error) {
      this.stopMicMonitor();
      const blocked = error && (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError');
      this.setState({ voiceConnecting: false, voiceActive: false, speaking: false, userSpeaking: false, micDetected: false, liveTranscript: '', voiceError: blocked ? 'Microphone access is blocked. Allow microphone access in your browser, then tap Start voice again.' : error && error.message ? error.message : 'Voice could not start. Please try again.' });
    }
  }
  stopVoice() {
    try { if (this._vapi) this._vapi.stop(); } catch (error) { /* already stopped */ }
    this.stopMicMonitor();
    if (this.state) this.setState({ voiceActive: false, voiceConnecting: false, speaking: false, userSpeaking: false, micDetected: false, liveTranscript: '' });
  }
  toggleVoice() {
    if (this.state.voiceActive || this.state.voiceConnecting) this.stopVoice();
    else this.startVoice();
  }

  // Hand the conversation to a human by emailing it through /api/contact.
  async submitHandoff(event) {
    event.preventDefault();
    if (this.state.hBusy) return;
    const name = (this.state.hName || '').trim();
    const email = (this.state.hEmail || '').trim();
    const note = (this.state.hMsg || '').trim();
    if (!name || !/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(email) || !note) {
      this.setState(s => ({
        messages: [...s.messages, { role: 'assistant', text: 'I need your name, a valid email, and a short note before I can send that on.' }]
      }));
      return;
    }
    this.setState({ hBusy: true });
    // Include the conversation so far so the team has the context.
    const transcript = this.state.messages
      .map(m => (m.role === 'user' ? 'Visitor: ' : 'Assistant: ') + m.text)
      .join('\n');
    const message = note + '\n\n--- Chat transcript ---\n' + transcript;
    let ok = false;
    try {
      const response = await fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name, email, message, source: 'assistant',
          product: 'Asked via site assistant', website: this.state.website
        })
      });
      const payload = await response.json().catch(() => ({}));
      ok = response.ok && payload.ok;
    } catch (e) {
      ok = false;
    }
    this.setState(s => ({
      hBusy: false,
      handoff: !ok,
      hName: ok ? '' : s.hName, hEmail: ok ? '' : s.hEmail, hMsg: ok ? '' : s.hMsg,
      messages: [...s.messages, {
        role: 'assistant',
        text: ok
          ? 'Sent — a certified AI professional will reply to ' + email + ' within one business day.'
          : "That didn't go through. Please email ai@felican.ai or call (561) 235-0799 and we'll pick it up."
      }]
    }));
  }
  componentDidUpdate() {
    const el = this.scrollRef.current;
    if (el) el.scrollTop = el.scrollHeight;
  }
  async send(text) {
    const q = (text || '').trim();
    if (!q || this.state.busy) return;
    this.setState(s => ({ messages: [...s.messages, { role: 'user', text: q }], draft: '', busy: true }));
    let reply = '';
    try {
      const history = [...this.state.messages, { role: 'user', text: q }]
        .map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }));
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history, website: this.state.website })
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || !payload.reply) throw new Error(payload.error || 'Assistant request failed');
      reply = payload.reply;
    } catch (e) {
      reply = "I couldn't reach the assistant just now. Email ai@felican.ai and we'll help directly.";
    }
    const finalReply = (reply || '').trim() || 'Sorry — could you rephrase that?';
    this.setState(s => ({ messages: [...s.messages, { role: 'assistant', text: finalReply }], busy: false }));
  }
  renderVals() {
    const chip = label => ({ label, go: () => this.send(label) });
    return {
      open: this.state.open,
      openStr: this.state.open ? 'true' : 'false',
      btnLabel: this.state.open ? 'Assistant open' : 'Talk to Felican AI',
      launcherLabel: this.state.open ? 'Close the Felican AI assistant' : 'Open the Felican AI assistant',
      busy: this.state.busy,
      sendLabel: this.state.busy ? 'Thinking' : 'Send',
      draft: this.state.draft,
      website: this.state.website,
      showChips: this.state.messages.length <= 1 && !this.state.handoff,
      composerOpen: !this.state.handoff,
      voiceStatus: this.state.voiceError || (this.state.voiceConnecting ? (this.state.micDetected ? 'We can hear you — connecting the AI…' : 'Connecting your microphone…') : this.state.speaking ? 'Felican AI is speaking — talk anytime to interrupt.' : this.state.userSpeaking ? (this.state.liveTranscript ? 'Hearing you: “' + this.state.liveTranscript.slice(0, 72) + '”' : 'We can hear you — keep talking.') : this.state.micDetected ? 'We can hear you — keep talking.' : this.state.voiceActive ? 'Listening — start talking. The bars move when we hear you.' : this.state.voiceSupported ? 'Tap Start voice, allow microphone access, then talk until you press Stop.' : 'Voice is loading. Text chat is ready now.'),
      voiceLabel: this.state.voiceActive || this.state.voiceConnecting ? 'Stop voice' : 'Start voice',
      voiceClass: this.state.speaking ? 'speaking' : this.state.userSpeaking || this.state.micDetected ? 'hearing' : this.state.voiceActive || this.state.voiceConnecting ? 'listening' : '',
      listeningStr: this.state.voiceActive || this.state.voiceConnecting ? 'true' : 'false',
      toggleVoice: () => this.toggleVoice(),
      scrollRef: this.scrollRef,
      messages: this.state.messages.map(m => m.role === 'user'
        ? { ...m, align: 'flex-end', bg: '#2FB894', fg: '#080E13', border: '#2FB894' }
        : { ...m, align: 'flex-start', bg: '#12181C', fg: '#EEF4F4', border: '#1C2A28' }),
      chips: [chip('What products do you offer?'), chip('Can you automate my business?'), chip('Tell me about the books')],
      handoff: this.state.handoff,
      handoffNote: 'We email this to the Felican AI team along with the chat above, and a person replies to you directly.',
      hName: this.state.hName,
      hEmail: this.state.hEmail,
      hMsg: this.state.hMsg,
      hBusy: this.state.hBusy,
      hSendLabel: this.state.hBusy ? 'Sending…' : 'Send to the team',
      openHandoff: () => this.setState(s => ({ handoff: true, hMsg: s.hMsg || s.draft })),
      closeHandoff: () => this.setState({ handoff: false }),
      onHName: e => this.setState({ hName: e.target.value }),
      onHEmail: e => this.setState({ hEmail: e.target.value }),
      onHMsg: e => this.setState({ hMsg: e.target.value }),
      sendHandoff: e => this.submitHandoff(e),
      toggle: () => { if (this.state.open) this.stopVoice(); this.setState(s => ({ open: !s.open })); },
      close: () => { this.stopVoice(); this.setState({ open: false }); },
      onDraft: e => this.setState({ draft: e.target.value }),
      onWebsite: e => this.setState({ website: e.target.value }),
      submit: e => { e.preventDefault(); this.send(this.state.draft); }
    };
  }
}
